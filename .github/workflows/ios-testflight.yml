name: Build iOS and upload to TestFlight

# Runs when you press "Run workflow" on the Actions tab,
# or automatically when the game or the iOS project changes on main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'ios/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/**'

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Every upload needs a new build number; the GitHub run number always goes up.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets are set
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Secret for $v is missing. See README step 3."; exit 1; fi
          done
          if [ -z "${{ secrets.ASC_KEY_P8 }}" ]; then echo "::error::Secret ASC_KEY_P8 is missing. See README step 3."; exit 1; fi

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Prepare game files
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Install App Store Connect API key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          OUT="$RUNNER_TEMP/keys/AuthKey.p8" python3 - <<'PY'
          # Rebuild the key in standard PEM layout, so pasting it with lost line breaks,
          # Windows line endings, or without the BEGIN/END lines still works.
          import base64, binascii, os, re, sys, textwrap
          raw = os.environ.get('P8', '').replace('\r', '').strip()
          body = re.sub(r'-----(BEGIN|END)[A-Z ]*-----', '', raw)
          body = re.sub(r'\s+', '', body)
          try:
              der = base64.b64decode(body, validate=True)
          except (binascii.Error, ValueError):
              der = b''
          if not (100 <= len(der) <= 200) or der[:1] != b'\x30':
              print("::error::ASC_KEY_P8 doesn't look like an App Store Connect .p8 key "
                    f"(decoded {len(der)} bytes, {len(body)} base64 characters). Open the AuthKey_XXXX.p8 file in Notepad, "
                    "select everything (Ctrl+A), copy, and paste it as the secret value.")
              sys.exit(1)
          pem = '-----BEGIN PRIVATE KEY-----\n' + '\n'.join(textwrap.wrap(body, 64)) + '\n-----END PRIVATE KEY-----\n'
          open(os.environ['OUT'], 'w').write(pem)
          print('API key installed.')
          PY
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Moonmoss.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive 2>&1 | tee "$RUNNER_TEMP/archive.log" || {
              grep -E "error:|error -|Error Domain|No profiles|No Account|failed" "$RUNNER_TEMP/archive.log" | grep -v "^\s*$" | sort -u | tail -8 | while IFS= read -r l; do echo "::error::$l"; done
              exit 1; }

      - name: Upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Moonmoss.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log" || {
              grep -E "error:|error -|Error Domain|failed|ITMS" "$RUNNER_TEMP/export.log" | sort -u | tail -8 | while IFS= read -r l; do echo "::error::$l"; done
              exit 1; }
          echo "Uploaded Moonmoss build $BUILD_NUMBER. It appears in TestFlight after Apple finishes processing (usually 5-30 minutes)."

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
