<title>Moonmoss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Nunito:wght@600;800&display=swap">
<style>
  /* Layout: one fixed 11:7 stage, letterboxed and centered; touch pads dock to the screen edges. */
  :root{
    --night:#0e0b17; --stage:#17152a; --cream:#f6e8c8; --muted:#a99cad;
    --pad:#27223aee; --pad-line:#7d718f88; --gold:#e7b85b;
    --display:'IM Fell English SC', Georgia, serif;
    --ui:Nunito, system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme:dark;
  }
  html,body{height:100%;margin:0;background:var(--night);color:var(--cream);overflow:hidden;font-family:var(--ui)}
  body{display:grid;place-items:center}
  #wrap{position:relative;width:min(100vw, calc(100dvh * 11 / 7));aspect-ratio:11/7;max-width:100%;max-height:100%}
  canvas{width:100%;height:100%;display:block;background:var(--stage);touch-action:none;outline:none}
  canvas:focus-visible{box-shadow:0 0 0 2px var(--gold)}
  #touch,#rotate{display:none}
  @media (pointer:coarse){
    /* Phones: shrink the stage so each side keeps a gutter for the thumbs; nothing on the controls covers the game. */
    :root{--gut:calc(126px + max(env(safe-area-inset-left,0px), env(safe-area-inset-right,0px)))}
    #wrap{width:min(calc(100vw - 2 * var(--gut)), calc(100dvh * 11 / 7))}
    #touch{display:block;position:fixed;inset:0;pointer-events:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    #stick,#acts,.mini{pointer-events:auto;touch-action:none}
    canvas:focus-visible{box-shadow:none}
    #stick{position:absolute;left:calc(env(safe-area-inset-left,0px) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:114px;height:114px;border-radius:50%;
      background:radial-gradient(circle,#27223a99 0 55%,#27223acc 56%);border:1.5px solid var(--pad-line)}
    #stick .arr{position:absolute;color:#cfc6b4aa;font:800 13px var(--ui);transform:translate(-50%,-50%)}
    #stick .l{left:16%;top:50%} #stick .r{left:84%;top:50%} #stick .d{left:50%;top:84%}
    #knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#4a3b66;border:1.5px solid #c9b6e8aa;box-shadow:0 0 12px #c9b6e844;transition:transform .06s}
    #stick.on #knob{background:#5d4a80;transition:none}
    #acts{position:absolute;right:calc(env(safe-area-inset-right,0px) + 6px);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:118px;height:132px}
    .act{position:absolute;display:grid;place-items:center;border-radius:50%;border:1.5px solid var(--pad-line);background:#27223acc;color:var(--cream);font:800 12px var(--ui);letter-spacing:.02em}
    .act.on{background:#5d4a80;border-color:#e7b85b}
    #aJump{width:64px;height:64px;left:27px;bottom:0;border-color:#e7b85b99}
    #aCast{width:54px;height:54px;left:0;top:0}
    #aDash{width:54px;height:54px;right:0;top:0}
    .mini{position:absolute;display:grid;place-items:center;min-width:52px;height:36px;padding:0 8px;border-radius:12px;border:1px solid var(--pad-line);background:#27223acc;color:var(--cream);font:800 11px var(--ui)}
    .mini.on{background:#5d4a80}
    #mFlask{left:calc(env(safe-area-inset-left,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 12px)}
    #mUse{right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 158px)}
    #mPause{right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 12px);min-width:40px}
    @media (orientation:portrait){
      #rotate{display:grid;place-items:center;position:fixed;inset:0;z-index:5;background:var(--night);color:var(--cream);font:800 18px var(--ui);text-align:center;padding:24px}
    }
  }
  @media (prefers-reduced-motion:reduce){ #knob{transition:none} }
</style>

<div id="wrap">
  <canvas id="game" width="1100" height="700" tabindex="0" aria-label="Moonmoss game"></canvas>
</div>
<div id="touch" aria-hidden="true">
  <div id="stick"><span class="arr l">◀</span><span class="arr r">▶</span><span class="arr d">▼</span><div id="knob"></div></div>
  <div id="acts"><div class="act" id="aCast" data-k="KeyZ">Cast</div><div class="act" id="aDash" data-k="KeyX">Dash</div><div class="act" id="aJump" data-k="Space">Jump</div></div>
  <div class="mini" id="mFlask" data-k="KeyQ">Flask</div>
  <div class="mini" id="mUse" data-k="KeyE">Use</div>
  <div class="mini" id="mPause" data-k="KeyP">II</div>
</div>
<div id="rotate">Turn your phone sideways to play Moonmoss</div>

<script>
(() => {
'use strict';
const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 1100, H = 700, FLOOR = 600;
const fD = s => `${s}px 'IM Fell English SC', Georgia, serif`;
const fI = s => `italic ${s}px 'IM Fell English', Georgia, serif`;
const fU = (s, w = 800) => `${w} ${s}px Nunito, system-ui, sans-serif`;

/* ---------------- helpers ---------------- */
const rand = (a, b) => Math.random() * (b - a) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const hash = n => { const s = Math.sin(n * 12.9898) * 43758.5453; return s - Math.floor(s); };
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function circRect(cx, cy, r, o) { const nx = clamp(cx, o.x, o.x + o.w), ny = clamp(cy, o.y, o.y + o.h); return (cx - nx) ** 2 + (cy - ny) ** 2 < r * r; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

/* ---------------- save data ---------------- */
const SAVE_KEY = 'moonmoss.v2';
let meta = { shards: 0, best: 0, runs: 0, wins: 0, heart: 0, flask: 0, power: 0, purse: 0, muted: false,
  feats: {}, endings: {}, maxPhase: 0, phase: 0, outfit: 'twilight', pipCoins: 0, seenPetals: false };
try { Object.assign(meta, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) {}
meta.feats = meta.feats || {}; meta.endings = meta.endings || {};
if (meta.wins > 0) { meta.feats.market = 1; meta.feats.moonfall = 1; meta.endings.moon = meta.endings.moon || meta.wins; }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(meta)); } catch (e) {} }

/* ---------------- input ---------------- */
const keys = {}, pressed = {};
const BLOCK = ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
addEventListener('keydown', e => { audio.ensure(); if (!keys[e.code]) pressed[e.code] = 1; keys[e.code] = 1; if (BLOCK.includes(e.code)) e.preventDefault(); });
addEventListener('keyup', e => { keys[e.code] = 0; });
addEventListener('blur', () => { for (const k in keys) keys[k] = 0; if (state === 'game') state = 'paused'; });
const touchMode = !!(window.matchMedia && matchMedia('(pointer:coarse)').matches);
const tKey = (k, v) => { if (v) { if (!keys[k]) pressed[k] = 1; keys[k] = 1; } else keys[k] = 0; };
// Movement pad: one finger, slide anywhere. Left/right come from the finger's offset from the pad's centre,
// so sliding across the middle flips direction without lifting. Pulling down drops through a platform.
(() => {
  const st = document.getElementById('stick'), knob = document.getElementById('knob'); if (!st) return;
  let pid = null, wasDown = false;
  const apply = e => {
    const r = st.getBoundingClientRect(), R = r.width / 2;
    let dx = e.clientX - (r.left + R), dy = e.clientY - (r.top + R);
    const d = Math.hypot(dx, dy), m = R * .62; if (d > m) { dx *= m / d; dy *= m / d; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    const dead = R * .16;
    tKey('ArrowLeft', dx < -dead); tKey('ArrowRight', dx > dead);
    const isDown = dy > R * .4 && Math.abs(dx) < dy * 1.3;
    if (isDown && !wasDown) { pressed.ArrowDown = 1; }
    keys.ArrowDown = isDown ? 1 : 0; wasDown = isDown;
  };
  const end = e => { if (e.pointerId !== pid) return; pid = null; st.classList.remove('on'); knob.style.transform = ''; tKey('ArrowLeft', 0); tKey('ArrowRight', 0); keys.ArrowDown = 0; wasDown = false; };
  st.addEventListener('pointerdown', e => { e.preventDefault(); audio.ensure(); if (pid !== null) return; pid = e.pointerId; st.setPointerCapture(pid); st.classList.add('on'); apply(e); });
  st.addEventListener('pointermove', e => { if (e.pointerId === pid) apply(e); });
  st.addEventListener('pointerup', end); st.addEventListener('pointercancel', end); st.addEventListener('lostpointercapture', end);
})();
// Action triangle: each finger "holds" whichever button it is over; sliding onto another button presses it.
(() => {
  const box = document.getElementById('acts'); if (!box) return;
  const btns = [...box.querySelectorAll('.act')], fingers = new Map();
  const over = e => {
    let best = null, bd = 1e9;
    for (const b of btns) { const r = b.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, d = Math.hypot(e.clientX - cx, e.clientY - cy);
      if (d < r.width * .72 && d < bd) { bd = d; best = b; } }
    return best;
  };
  const sync = () => {
    const held = new Set([...fingers.values()].filter(Boolean).map(b => b.dataset.k));
    for (const b of btns) { const k = b.dataset.k, on = held.has(k); if (on && !keys[k]) pressed[k] = 1; keys[k] = on ? 1 : 0; b.classList.toggle('on', on); }
  };
  box.addEventListener('pointerdown', e => { e.preventDefault(); audio.ensure(); box.setPointerCapture(e.pointerId); fingers.set(e.pointerId, over(e)); sync(); });
  box.addEventListener('pointermove', e => { if (!fingers.has(e.pointerId)) return; const b = over(e); if (b !== fingers.get(e.pointerId)) { fingers.set(e.pointerId, b); sync(); } });
  const end = e => { if (fingers.delete(e.pointerId)) sync(); };
  box.addEventListener('pointerup', end); box.addEventListener('pointercancel', end); box.addEventListener('lostpointercapture', end);
})();
document.querySelectorAll('.mini').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); audio.ensure(); tKey(k, 1); b.classList.add('on'); });
  const off = () => { keys[k] = 0; b.classList.remove('on'); };
  b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
});
const useLabel = touchMode ? 'Tap Use' : 'Press E';
const down = (...a) => a.some(k => keys[k]), hit = (...a) => a.some(k => pressed[k]);
let mouse = { x: -1, y: -1 }, ui = [];
function toCanvas(e) { const r = C.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
C.addEventListener('pointermove', e => { mouse = toCanvas(e); });
C.addEventListener('pointerdown', e => {
  audio.ensure(); C.focus(); const p = toCanvas(e); mouse = p;
  for (let i = ui.length - 1; i >= 0; i--) { const b = ui[i]; if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { audio.select(); b.cb(); return; } }
});

/* ---------------- audio ---------------- */
let musicMode = 'calm';
const VOL = 1;
const audio = {
  c: null, master: null, music: null, sfx: null, step: 0, next: 0, coinT: 0,
  ensure() {
    if (this.c) { if (this.c.state === 'suspended') this.c.resume(); return; }
    try {
      const A = window.AudioContext || window.webkitAudioContext; this.c = new A();
      // Individual tones use small volumes; the buses below lift them to a normal game level,
      // and a limiter on the master keeps piles of overlapping sounds from clipping.
      const soft = this.c.createWaveShaper(), curve = new Float32Array(1024); for (let i = 0; i < 1024; i++) { const x = i / 511.5 - 1; curve[i] = .94 * Math.tanh(x / .94); } soft.curve = curve; soft.connect(this.c.destination);
      const lim = this.c.createDynamicsCompressor(); lim.threshold.value = -10; lim.knee.value = 3; lim.ratio.value = 20; lim.attack.value = .001; lim.release.value = .15; lim.connect(soft);
      this.master = this.c.createGain(); this.master.gain.value = meta.muted ? 0 : VOL; this.master.connect(lim);
      const lp = this.c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200; lp.connect(this.master);
      this.music = this.c.createGain(); this.music.gain.value = 3.2; this.music.connect(lp);
      this.sfx = this.c.createGain(); this.sfx.gain.value = 6.5; this.sfx.connect(this.master);
      setInterval(() => this.tick(), 50);
    } catch (e) { this.c = null; }
  },
  toggleMute() { meta.muted = !meta.muted; save(); if (this.master) this.master.gain.value = meta.muted ? 0 : VOL; },
  at(t, f, d, type = 'sine', v = .08, slide = 1, dest) {
    const c = this.c; if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(dest || this.sfx); o.start(t); o.stop(t + d + .05);
  },
  tone(f, d, type, v, when = 0, slide = 1) { if (this.c) this.at(this.c.currentTime + when, f, d, type, v, slide); },
  noise(d = .08, v = .05, when = 0, freq = 0, dest) {
    const c = this.c; if (!c) return;
    const len = Math.max(1, Math.floor(c.sampleRate * d)), b = c.createBuffer(1, len, c.sampleRate), ch = b.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = c.createBufferSource(), g = c.createGain(); s.buffer = b; g.gain.value = v;
    let node = s; if (freq) { const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; s.connect(f); node = f; }
    node.connect(g); g.connect(dest || this.sfx); s.start(c.currentTime + (when > 1 ? 0 : when));
  },
  cast(k) {
    const p = { moon: 520, ember: 300, thorn: 880, star: 400, frost: 700, gale: 600 }[k] || 500;
    this.tone(p, .07, 'triangle', .045, 0, 1.5); if (k === 'star' || k === 'ember') this.tone(p / 2, .14, 'sine', .04, .02, .8);
  },
  jump() { this.tone(300, .1, 'square', .03, 0, 1.7); },
  djump() { this.tone(420, .12, 'triangle', .045, 0, 1.8); this.tone(630, .1, 'sine', .03, .05, 1.4); },
  dash() {
    const c = this.c; if (!c) return;
    const t = c.currentTime, d = .26, len = Math.floor(c.sampleRate * d), b = c.createBuffer(1, len, c.sampleRate), ch = b.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); s.buffer = b;
    f.type = 'bandpass'; f.Q.value = 1.3;
    f.frequency.setValueAtTime(450, t); f.frequency.exponentialRampToValueAtTime(2800, t + .07); f.frequency.exponentialRampToValueAtTime(800, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.11, t + .025); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    s.connect(f); f.connect(g); g.connect(this.sfx); s.start(t); s.stop(t + d + .02);
    this.tone(760, .13, 'sine', .016, .015, 1.45);
  },
  hit() { this.tone(160, .07, 'square', .04, 0, .5); this.noise(.05, .03, 0, 2400); },
  kill() { this.tone(330, .09, 'triangle', .05, 0, 2); this.tone(660, .14, 'sine', .04, .06, 1.2); this.noise(.12, .04, 0, 900); },
  hurt() { this.tone(110, .22, 'sawtooth', .08, 0, .5); this.noise(.14, .06, 0, 500); },
  coin() { if (!this.c || this.c.currentTime - this.coinT < .045) return; this.coinT = this.c.currentTime; this.tone(1320 + Math.random() * 200, .06, 'sine', .035, 0, 1.3); },
  chest() { [392, 494, 587, 784].forEach((f, i) => this.tone(f, .2, 'sine', .05, i * .07)); },
  room() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, .3, 'triangle', .04, i * .09)); },
  buy() { this.tone(880, .08, 'sine', .05); this.tone(1320, .14, 'sine', .045, .07); },
  deny() { this.tone(180, .12, 'square', .04); this.tone(150, .14, 'square', .035, .08); },
  flask() { this.tone(500, .2, 'sine', .05, 0, 1.6); this.noise(.2, .025, 0, 3000); },
  spawn() { this.tone(200, .4, 'sine', .03, 0, 2.2); },
  select() { this.tone(660, .05, 'triangle', .035); },
  boss() { this.tone(70, 1.2, 'sawtooth', .07, 0, .6); this.noise(.8, .06, 0, 300); },
  beam() { this.tone(900, .35, 'sawtooth', .025, 0, .3); },
  win() { [523, 659, 784, 1046, 1318].forEach((f, i) => this.tone(f, .5, 'triangle', .045, i * .12)); },
  lose() { [392, 330, 262, 196].forEach((f, i) => this.tone(f, .45, 'triangle', .045, i * .16)); },
  tick() {
    const c = this.c; if (!c) return;
    const spb = musicMode === 'boss' ? .19 : .26;
    if (this.next < c.currentTime) this.next = c.currentTime + .05;
    while (this.next < c.currentTime + .22) { this.playStep(this.step, this.next); this.step++; this.next += spb; }
  },
  playStep(s, t) {
    if (state === 'paused') return;
    const prog = musicMode === 'boss' ? [[0, 3], [-4, 4], [-2, 4], [-5, 3]] : [[0, 3], [-4, 4], [3, 4], [-2, 4]];
    const [r, q] = prog[Math.floor(s / 8) % 4];
    const tones = [r, r + q, r + 7, r + 12], seq = [0, 2, 1, 3, 2, 1, 3, 2];
    const quiet = state !== 'game' && state !== 'choose';
    const v = quiet ? .022 : .032;
    if (!quiet || s % 2 === 0) this.at(t, 220 * Math.pow(2, (tones[seq[s % 8]] + (s % 16 >= 8 ? 12 : 0)) / 12), .4, 'triangle', v, 1, this.music);
    if (s % 8 === 0) this.at(t, 55 * Math.pow(2, r / 12), 1.9, 'sine', .05, 1, this.music);
    if (musicMode === 'boss' && !quiet) {
      if (s % 2 === 0) this.at(t, 110 * Math.pow(2, r / 12), .18, 'sawtooth', .018, .98, this.music);
      if (s % 4 === 0) { this.at(t, 90, .14, 'sine', .07, .4, this.music); }
    }
  }
};

/* ---------------- content ---------------- */
const WEAPONS = {
  moon:  { id: 'moon',  name: 'Moon Bolt',    dmg: 2,    rate: .3,  speed: 560, r: 6,  color: '#d6b7ff', desc: 'Steady crescent bolts. Dependable at any range.' },
  ember: { id: 'ember', name: 'Ember Bloom',  dmg: 2.6,  rate: .5,  speed: 400, r: 8,  color: '#ffad6e', desc: 'Slow orbs that burst and scorch everything nearby.' },
  thorn: { id: 'thorn', name: 'Thorn Needle', dmg: 1.1,  rate: .12, speed: 720, r: 5,  color: '#9ed47e', desc: 'Rapid needles that pierce through two foes.' },
  star:  { id: 'star',  lock: 'moonfall', name: 'Starbell',     dmg: 3.6,  rate: .62, speed: 470, r: 10, color: '#ffe08a', desc: 'Heavy stars that shatter into three sparks on impact.' },
  frost: { id: 'frost', lock: 'market', name: 'Frost Sigil',  dmg: 1.8,  rate: .34, speed: 520, r: 7,  color: '#9fd8f0', desc: 'Chilling bolts that slow foes to half speed.' },
  gale:  { id: 'gale',  name: 'Gale Fan',     dmg: 1.25, rate: .4,  speed: 540, r: 5,  color: '#c8f0dc', desc: 'Three bolts in a fan. Built for crowds.' }
};
const RELICS = [
  { id: 'moth',   name: 'Moth Cloak',     color: '#c9b6e8', desc: 'Move 15% faster.', apply: p => p.speed *= 1.15 },
  { id: 'teacup', name: 'Warm Teacup',    color: '#df879e', desc: '+2 maximum hearts, and heal 2.', apply: p => { p.maxhp += 2; p.hp += 2; } },
  { id: 'pmoon',  name: 'Pocket Moon',    color: '#e8dcb6', desc: 'Spells deal +0.75 damage.', apply: p => p.bonusDmg += .75 },
  { id: 'velvet', name: 'Velvet Boots',   color: '#a86fd0', desc: 'Jump a second time in midair.', unique: 1, apply: p => p.jumps = 2 },
  { id: 'witch',  name: 'Witching Hour',  color: '#8a7cf0', desc: 'Cast 20% faster.', apply: p => p.rateMult *= .8 },
  { id: 'acorn',  name: 'Silver Acorn',   color: '#d0d4dc', desc: 'Foes drop 50% more mooncoins.', apply: p => p.coinMult += .5 },
  { id: 'bell',   name: 'Glass Bell',     color: '#9fd8f0', desc: 'Dash recharges 35% faster.', apply: p => p.dashCdBase *= .65 },
  { id: 'mheart', name: 'Mossy Heart',    color: '#78936b', desc: 'Heal 1 heart each time you enter a new room.', unique: 1, apply: p => p.roomHeal = true },

function makeWave(n, d, elite) {
